name: Android CI/CD (Kotlin APK Build & Release)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Persistent Signing Keystore
        if: env.KTP_KEYSTORE_B64 != ''
        env:
          KTP_KEYSTORE_B64: ${{ secrets.KTP_KEYSTORE_B64 }}
        run: |
          echo "${KTP_KEYSTORE_B64}" | base64 -d > android/app/ktp-signing.p12

      - name: Run Kotlin Unit Tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Debug & Release APKs
        working-directory: android
        env:
          KTP_KEYSTORE_PASS: ${{ secrets.KTP_KEYSTORE_PASS }}
        run: |
          gradle assembleDebug assembleRelease \
            -PktpVersionCode="${{ github.run_number }}" \
            -PktpVersionName="1.2.${{ github.run_number }}" \
            --no-daemon
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/KTP-IPTV-v1.2.${{ github.run_number }}.apk"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktp-iptv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktp-iptv-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Prepare Release Metadata
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.2.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=${TAG_NAME}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "KTP IPTV Android ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/KTP-IPTV-*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
